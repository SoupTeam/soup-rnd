# A5 ticket 04, arm B: L2L, each streamed layer loads once per optimizer step (k = 4).
base: mistralai/Mistral-7B-v0.1
task: sft
backend: transformers

data:
  train: data/alpaca64.jsonl
  format: alpaca
  max_length: 256
  chat_template: mistral
  val_split: 0.0

training:
  epochs: 1
  lr: 2e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  quantization: 4bit
  scheduler: linear
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_steps: 1
  seed: 42
  data_seed: 42
  rewind_log: false
  save_steps: 1000
  stream_layers: true
  stream_source: ram
  l2l: true
  lora:
    r: 8
    alpha: 16
    dropout: 0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

output: ./out/run/
